name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      BOOKCRUNCH_PARSER: fake
      # Throwaway database for tests/db (migrations and constraints); same image as docker-compose.
      TEST_DATABASE_URL: postgresql+asyncpg://bookcrunch:bookcrunch@localhost:5432/bookcrunch_test
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bookcrunch
          POSTGRES_PASSWORD: bookcrunch
          POSTGRES_DB: bookcrunch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookcrunch -d bookcrunch_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Parser contract (required on every pull request)
        run: pytest tests/parsing/test_contract.py
      - name: All tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: |
          cp .env.example .env
          docker compose build
