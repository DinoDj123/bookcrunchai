[project]
name = "bookcrunch-backend"
version = "0.1.0"
description = "bookcrunch.ai API, worker and processing pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30",
    "alembic>=1.14,<2",
    "pgvector>=0.3",
    "arq>=0.26",
    "argon2-cffi>=23.1",  # password hashing (FR-001)
    "pyjwt>=2.9,<3",  # session token (section 7.3)
    "python-multipart>=0.0.12",  # file uploads in FastAPI (FR-002)
    "email-validator>=2.2",  # EmailStr in request schemas
    # Parsing libraries (EbookLib, BeautifulSoup, PyMuPDF) are added by Track A with the real parser.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# The two shared contract files predate this config and do not follow it yet. They can only be
# changed with both developers' agreement (CLAUDE.md), so they are excluded until then.
extend-exclude = [
    "migrations/versions",
    "app/parsing/contract.py",
    "tests/parsing/test_contract.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
